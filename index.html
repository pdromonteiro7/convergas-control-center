<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convergas · Control Center</title>
<meta name="app-build" content="2026-11-11-posvendas" />
<meta name="description" content="Convergas Control Center — Qualidade e T.I. Single source of truth da operação." />
<link rel="icon" href="assets/logo-icone.png" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body class="booting rl-on">
<canvas id="bgfx" aria-hidden="true"></canvas>
<div class="fx-bg" aria-hidden="true"><span class="fx-aur a1"></span><span class="fx-aur a2"></span><span class="fx-grain"></span></div>

<div class="app-shell">
  <!-- ===== SIDEBAR ===== -->
  <aside class="side">
    <div class="side-card">
      <button class="brand" id="brandHome" title="Voltar à Home">
        <span class="flame"><img src="assets/logo-icone.png" alt="Convergas" /></span>
        <span class="bt">
          <span class="nm">Convergas</span>
          <span class="tg-row"><span class="tg">CONTROL CENTER</span><span class="brand-area" id="brandArea">T.I</span></span>
        </span>
      </button>

      <nav class="nav" id="nav"><!-- preenchido por área --></nav>

      <div class="side-foot">
        <button class="home-link" id="homeLink"><span data-icon="home"></span>Trocar de área</button>
        <div class="sys-pulse" id="sysPulse">
          <span class="pulse-dot"></span>
          <span class="pulse-tx">Sistema operacional</span>
        </div>
        <span class="side-ver">v1.0 · MVP</span>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="topbar">
      <button class="tb-mini menu-btn" id="menuBtn" aria-label="Menu" data-icon="menu"></button>
      <div class="tb-session" title="Setor atual">
        <span class="tb-dot"></span>
        <span class="tb-area" id="crumbRoot">Control Center</span>
        <span class="tb-page" id="crumbCur" hidden></span>
      </div>
      <button class="tb-home" id="tbHome" aria-label="Voltar à Home" title="Voltar à Home" data-icon="home"></button>
      <button class="tb-mini tb-fs" id="fsToggle" aria-label="Tela cheia" title="Tela cheia" data-icon="maximize"></button>
      <button class="tb-mini tb-theme" id="themeToggle" aria-label="Alternar tema" data-icon="moon"></button>
    </header>

    <div class="view" id="view"><!-- pages render here --></div>
  </main>
</div>

<!-- backdrop for mobile sidebar -->
<div class="scrim" id="scrim"></div>

<!-- ===== MODAL ROOT ===== -->
<div class="modal-root" id="modalRoot" aria-hidden="true">
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<!-- ===== HOME — seletor orbital de áreas ===== -->
<div class="home-screen" id="homeScreen" aria-hidden="true">
  <div class="hx-bg" aria-hidden="true">
    <span class="hx-aur a1"></span><span class="hx-aur a2"></span><span class="hx-aur a3"></span>
    <span class="hx-dots"></span><span class="hx-spot"></span><span class="hx-grain"></span>
  </div>

  <header class="hx-top">
    <div class="hx-brand">
      <img src="assets/logo-icone.png" alt="Convergas" />
      <div class="hx-brand-tx"><b>Convergas</b><span>Control Center</span></div>
    </div>
    <div class="hx-status"><span class="hx-live" aria-hidden="true"></span><span id="homeClock"></span></div>
    <div class="hx-tools">
      <button class="hx-tool" id="themeToggleHome" aria-label="Alternar tema" title="Alternar tema" data-icon="moon"></button>
      <button class="hx-tool" id="fsToggleHome" aria-label="Tela cheia" title="Tela cheia" data-icon="maximize"></button>
    </div>
  </header>

  <main class="hx-stage" id="homeStage">
    <div class="hx-intro">
      <span class="hx-kick" id="homeKick">Painel de operações</span>
      <h1 id="homeGreet">Bem-vindo</h1>
      <p>Selecione uma área na roda para começar. Os números são atualizados em tempo real.</p>
    </div>
    <div class="hx-wheel" id="wheelMount" role="listbox" aria-label="Áreas do Control Center"></div>
    <nav class="hx-index" id="homeIndex" aria-label="Índice de áreas"></nav>
  </main>

  <footer class="hx-foot">
    <button class="hx-go" id="homeGo" type="button">Entrar em <b></b><span data-icon="arrowUpRight"></span></button>
    <div class="hx-keys" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd><span>navegar</span><kbd>↵</kbd><span>entrar</span><kbd>1–6</kbd><span>atalho</span></div>
    <div class="hx-links">
      <button class="hx-link" id="homeGuideline"><span data-icon="book"></span>Manual da marca</button>
      <a href="https://www.convergas.com.br/" target="_blank" rel="noopener noreferrer" class="hx-link"><span data-icon="globe"></span>convergas.com.br</a>
      <a href="https://www.instagram.com/convergasfuelsystems/" target="_blank" rel="noopener noreferrer" class="hx-soc" title="Instagram" aria-label="Instagram da Convergas"><span data-icon="instagram"></span></a>
      <a href="https://br.linkedin.com/company/convergas" target="_blank" rel="noopener noreferrer" class="hx-soc" title="LinkedIn" aria-label="LinkedIn da Convergas"><span data-icon="linkedin"></span></a>
    </div>
  </footer>
</div>

<!-- ===== MOBILE NAV — tab bar flutuante + bottom sheet (só no celular) ===== -->
<nav class="mnav" id="mnav" aria-label="Navegação rápida"></nav>
<div class="msheet-scrim" id="msheetScrim" aria-hidden="true"></div>
<section class="msheet" id="msheet" role="dialog" aria-modal="true" aria-hidden="true">
  <span class="msheet-grab" aria-hidden="true"></span>
  <div class="msheet-body" id="msheetBody"></div>
</section>

<!-- ===== TELA DE CARREGAMENTO (abertura e troca de abas) ===== -->
<div class="route-loader show" id="routeLoader" aria-hidden="false" role="status" aria-live="polite">
  <div class="rl-core">
    <svg class="rl-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="rl-track" cx="60" cy="60" r="54"/><circle class="rl-arc" cx="60" cy="60" r="54"/></svg>
    <img src="assets/logo-icone.png" alt="" />
  </div>
  <div class="rl-tx"><span id="rlArea">Convergas</span><b id="rlPage">Control Center</b></div>
  <div class="rl-bar"><span></span></div>
</div>

<!-- ===== TOASTS ===== -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/icons.js"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
